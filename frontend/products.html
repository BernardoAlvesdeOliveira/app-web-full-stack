<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Products | Inventory</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="page-shell">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Inventory management</p>
                    <h1>Registered Products</h1>
                </div>
                <a class="button button-primary" href="index.html">Add product</a>
            </header>
            <section class="card">
                <div class="section-heading">
                    <div>
                        <h2>All products</h2>
                        <p class="intro">A complete list of products currently in your inventory.</p>
                    </div>
                    <button class="button button-secondary" id="refreshButton" type="button">Refresh</button>
                </div>
                <div id="productsState" class="message hidden" role="status"></div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Registered on</th>
                            </tr>
                        </thead>
                        <tbody id="productsTable"></tbody>
                    </table>
                </div>
            </section>
        </main>
        <script src="products.js"></script>
    </body>
</html>
