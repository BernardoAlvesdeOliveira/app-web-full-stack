<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Registration</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="page-shell">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Inventory management</p>
                    <h1>Product Registration</h1>
                </div>
                <a class="button button-secondary" href="products.html">View products</a>
            </header>
            <section class="card form-container">
                <p class="intro">Add a product to your inventory in a few seconds.</p>
            <form id="productForm">
                <label for="product_name">Product Name:</label>
                <input type="text" id="product_name" name="product_name" placeholder="Enter the product name" required>

                <label for="amount">Quantity:</label>
                <input type="text" id="amount" name="amount" min="1" placeholder="Enter the product quantity" required>
                <button class="button button-primary" type="submit">Save product</button>
            </form>
            <div id="responseMessage" class="hidden" role="status"></div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
